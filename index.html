    <!-- Set dynamic full URLs for meta tags (Vercel compatible) -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var baseUrl = window.location.origin;
            var currentUrl = baseUrl + window.location.pathname + (window.location.search || '');
            var imageUrl = baseUrl + '/icon-512x512.png';
            
            function updateMetaContent(id, content) {
              var meta = document.getElementById(id);
              if (meta) {
                meta.setAttribute('content', content);
              }
            }
            
            updateMetaContent('og-url', currentUrl);
            updateMetaContent('og-image', imageUrl);
            updateMetaContent('twitter-url', currentUrl);
            updateMetaContent('twitter-image', imageUrl);
            
            // Update canonical URL
            var canonical = document.getElementById('canonical-url');
            if (canonical) {
              canonical.setAttribute('href', currentUrl);
            }
          }
        } catch(e) {
          // Silent fail if window is not available
        }
      })();
    </script>
    
    <!-- Schema.org structured data for Google Search -->

    </script>
    <script type="application/ld+json" id="website-schema">
      {
        "@context": "https://schema.org",

        "name": "ZgłośPomnik",
        "url": "/",

        "inLanguage": "pl-PL",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json" id="webapp-schema">
      {
        "@context": "https://schema.org",

        "url": "/",
        "applicationCategory": "UtilityApplication",

        "description": "ZgłośPomnik - profesjonalna platforma do zgłaszania i ochrony pomników przyrody",
        "screenshot": "/icon-512x512.png",
        "logo": "/icon-512x512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "PLN"
        }
      }
    </script>
    
    <!-- Update schema.org URLs dynamically -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var baseUrl = window.location.origin;
            var currentUrl = baseUrl + window.location.pathname + (window.location.search || '');
            var imageUrl = baseUrl + '/icon-512x512.png';
            
            // Update Organization schema
            var orgSchema = document.getElementById('organization-schema');
            if (orgSchema) {
              var orgData = JSON.parse(orgSchema.textContent);
              orgData.url = currentUrl;
              orgData.logo = imageUrl;
              orgSchema.textContent = JSON.stringify(orgData);
            }
            
            // Update Website schema
            var webSchema = document.getElementById('website-schema');
            if (webSchema) {
              var webData = JSON.parse(webSchema.textContent);
              webData.url = currentUrl;
              if (webData.potentialAction && webData.potentialAction.target) {
                webData.potentialAction.target = baseUrl + webData.potentialAction.target.replace('/', '');
              }
              webSchema.textContent = JSON.stringify(webData);
            }
            
            // Update WebApplication schema
            var appSchema = document.getElementById('webapp-schema');
            if (appSchema) {
              var appData = JSON.parse(appSchema.textContent);
              appData.url = currentUrl;
              appData.logo = imageUrl;
              appData.screenshot = imageUrl;
              appSchema.textContent = JSON.stringify(appData);
            }
          }
        } catch(e) {
          // Silent fail if window is not available
        }
      })();
    </script>
